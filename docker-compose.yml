services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextrack
      POSTGRES_PASSWORD: nextrack
      POSTGRES_DB: nextrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextrack"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://nextrack:nextrack@db:5432/nextrack
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://nextrack:nextrack@db:5432/nextrack
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - setup

volumes:
  pgdata:
